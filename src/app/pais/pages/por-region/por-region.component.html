<div class="animate__animated animate__fadeIn animate__faster">
    <h3>Buscar por región
        <small>{{regionActiva | titlecase}}</small>
    </h3>

    <h5>seleccione la región</h5>
    <div class="row">
        <div class="col">
            <!-- [class.btn-primary] ="region === regionActiva" -->
            <!--
            [ngClass]="{
            'btn-primary': regionActiva === region,
            'btn-outline-primary': regionActiva !== region
        }" 
        <!--[class]="(region === regionActiva ? 'btn btn-primary' : 'btn btn-outline-primary')" > Condicional ternario -->
            <button *ngFor="let region of regiones" (click)="activarRegion(region)" [class]="getClaseCss(region)">
                {{region }}
            </button>
        </div>
    </div>

    <div *ngIf="paises.length > 0" class="row">
        <div class="col">
            <app-pais-tabla [paises]="paises"></app-pais-tabla>
        </div>
    </div>
</div>
